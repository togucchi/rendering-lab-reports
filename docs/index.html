<body><a class="skip" href="#content">本文へ</a><header><a href="index.html">RENDERING LAB</a><span>実験と検証の記録</span></header><main id="content"><h1>Rendering Lab / 実験ノート</h1><p>小さな描画実験を、条件と証拠を添えて残す場所。</p><h2>レポート</h2><ul><li><a href="001-procedural-courtyard/index.html">001 · プロシージャル中庭</a>：実メッシュ、深度、Lambert lighting の基準描画。</li></ul><h2>読み方</h2><p>実装・自動テスト・実描画・ブラウザー操作を分けて記録します。画像があることは、性能や実機での動作保証を意味しません。未計測の値は埋めずに残します。</p><p>各レポートには対象コードの commit、実行条件、確認済み事項、未検証事項、画像と機械可読な実行記録を添えます。</p></main><footer>条件と証拠を残す、小さな描画実験。</footer></body></html>
